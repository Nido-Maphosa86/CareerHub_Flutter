name: careerhub
description: "CareerHub — Flutter mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.0.3
  go_router: ^17.3.0
  dio: ^5.7.0
  riverpod_annotation: ^3.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  isar_community: ^3.3.0
  isar_community_flutter_libs: ^3.3.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^10.3.1
  shimmer: ^3.0.0

  # Assignment 3.1 additions.
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^3.0.0
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2

  # Assignment 3.3 additions.
  # Pinned to ^2.1.0 in the assignment brief, but no such version is
  # published on pub.dev — 1.4.4 is the latest available release, so that
  # is what is used here (documented in README.md under Part 6).
  signalr_netcore: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  isar_community_generator: ^3.3.0

  # Assignment 3.2 additions.
  mocktail: ^0.3.0
  patrol: ^3.14.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true